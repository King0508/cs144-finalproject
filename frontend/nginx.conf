server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # SPA fallback: any path that isn't a real file falls back to index.html so
  # React Router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker must NOT be cached or the user can't get updates.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # Long-cache hashed assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # --- Security headers -------------------------------------------------------
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # HTTP Strict Transport Security. TLS terminates at the GKE managed-cert
  # Ingress; this header tells browsers to pin HTTPS for a year.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Content Security Policy. 'unsafe-inline' is scoped to style-src only (Tailwind
  # and the Google Fonts <link> need it); scripts stay locked to same-origin plus
  # the Google API host used by the Firebase Auth popup. The googleapis / google
  # / firebaseapp hosts cover Firestore, Identity Toolkit, secure-token, and FCM.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://*.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
}
