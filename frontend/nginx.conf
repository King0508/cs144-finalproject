server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # SPA fallback: any path that isn't a real file falls back to index.html so
  # React Router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker must NOT be cached or the user can't get updates.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # Long-cache hashed assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Security headers (CSP is intentionally permissive for inline styles Tailwind
  # injects in dev; in prod the bundle is hash-stable so this could be tightened).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
