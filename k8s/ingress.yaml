apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: ministry-cert
  namespace: ministry
spec:
  domains:
    # Replace with the instructor-provided (or your own) hostname before
    # `kubectl apply -f k8s/`.
    - DOMAIN_PLACEHOLDER
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ministry-ingress
  namespace: ministry
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "ministry-ip"
    networking.gke.io/managed-certificates: "ministry-cert"
    # Redirect HTTP -> HTTPS via a FrontendConfig (optional; see SETUP.md).
spec:
  rules:
    - host: DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
